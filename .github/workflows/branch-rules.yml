name: "Branch Naming Rules"

on: pull_request

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: deepakputhraya/action-branch-name@master
        with:
          regex: '([a-z]+)\/([a-z0-9-]+)' # Ex: feature/nome-task, fix/task-id
          allowed_prefixes: 'feature,fix,hotfix,docs,refactor'
          ignore: 'main,master,develop'
          min_length: 5
          max_length: 50
