name: Update Board Metrics

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: update-board-metrics
  cancel-in-progress: true

jobs:
  update-metrics:
    name: Fetch All Metrics & Update config.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      - name: Download test artifacts from CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p /tmp/test-results
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n test-results -D /tmp/test-results; then
            echo "Artifacts downloaded from CI run $RUN_ID"
          else
            echo "No test-results artifact found for CI run $RUN_ID"
          fi

      - name: Fetch all metrics via REST + GraphQL
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: IA-para-DEVs-SCTEC-T2
          REPO: mini-projeto-tokemize
          PROJECT_NUMBER: 5
        run: |
          set -e

          # ── Stats do repositório (REST) ──────────────────────────────────
          COMMITS=$(gh api "/repos/$OWNER/$REPO/commits?per_page=1" \
            --include --silent 2>/dev/null | \
            grep -i '^link:' | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "1")

          OPEN_PRS=$(gh api "/repos/$OWNER/$REPO/pulls?state=open&per_page=1" \
            --include --silent 2>/dev/null | \
            grep -i '^link:' | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "0")

          CLOSED_PRS=$(gh api "/repos/$OWNER/$REPO/pulls?state=closed&per_page=1" \
            --include --silent 2>/dev/null | \
            grep -i '^link:' | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "0")

          BRANCHES=$(gh api "/repos/$OWNER/$REPO/branches?per_page=1" \
            --include --silent 2>/dev/null | \
            grep -i '^link:' | grep -oP 'page=\K\d+(?=>; rel="last")' || echo "1")

          LAST_COMMIT=$(gh api "/repos/$OWNER/$REPO/commits?sha=main&per_page=1" \
            --jq '.[0].commit.author.date' 2>/dev/null || echo "")

          # ── Contributors com avatares (REST) ─────────────────────────────
          CONTRIBUTORS=$(gh api "/repos/$OWNER/$REPO/contributors?per_page=30" \
            --jq '[.[] | {login: .login, contributions: .contributions, avatar_url: .avatar_url, html_url: .html_url}]' \
            2>/dev/null || echo "[]")

          CONTRIBUTORS_COUNT=$(echo "$CONTRIBUTORS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")

          # ── PRs por autor (REST) ─────────────────────────────────────────
          ALL_PRS=$(gh api "/repos/$OWNER/$REPO/pulls?state=all&per_page=100" \
            --jq '[.[] | {login: .user.login, state: .state, avatar_url: .user.avatar_url, html_url: .user.html_url}]' \
            2>/dev/null || echo "[]")

          # ── Board metrics (GraphQL) ──────────────────────────────────────
          BOARD_RESPONSE=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  title
                  number
                  items(first: 100) {
                    totalCount
                    nodes {
                      content {
                        ... on Issue { title }
                        ... on PullRequest { title }
                      }
                      fieldValues(first: 10) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            field { ... on ProjectV2SingleSelectField { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$OWNER" \
            -F number="$PROJECT_NUMBER" \
            2>/dev/null || echo '{"data":{"organization":{"projectV2":null}}}')

          # Salva tudo em arquivos temporários para o Python ler
          echo "$COMMITS"      > /tmp/commits.txt
          echo "$OPEN_PRS"     > /tmp/open_prs.txt
          echo "$CLOSED_PRS"   > /tmp/closed_prs.txt
          echo "$BRANCHES"     > /tmp/branches.txt
          echo "$LAST_COMMIT"  > /tmp/last_commit.txt
          echo "$CONTRIBUTORS_COUNT" > /tmp/contributors_count.txt
          echo "$CONTRIBUTORS" > /tmp/contributors.json
          echo "$ALL_PRS"      > /tmp/all_prs.json
          echo "$BOARD_RESPONSE" > /tmp/board.json

          echo "Dados coletados com sucesso."

      - name: Read test metrics (if available)
        id: test_metrics
        run: |
          ARTIFACT_METRICS_FILE=$(find /tmp/test-results -name 'test-metrics.json' 2>/dev/null | head -n 1)

          if [ -n "$ARTIFACT_METRICS_FILE" ] && [ -f "$ARTIFACT_METRICS_FILE" ]; then
            echo "Test metrics artifact found at $ARTIFACT_METRICS_FILE"
            cat "$ARTIFACT_METRICS_FILE" > /tmp/test_metrics_data.json
          elif [ -f "/tmp/test-metrics.json" ]; then
            echo "Local test metrics found, copying to /tmp/test_metrics_data.json"
            cat /tmp/test-metrics.json > /tmp/test_metrics_data.json
          else
            echo "No test metrics available, will use previous values"
            echo "{}" > /tmp/test_metrics_data.json
          fi

      - name: Update config.json
        run: |
          python3 - <<'PYEOF'
          import json, os, shutil
          from datetime import datetime, timezone

          def read(path, default=""):
              try:
                  return open(path).read().strip()
              except:
                  return default

          def read_json(path, default):
              try:
                  return json.loads(open(path).read())
              except:
                  return default

          def update_test_metrics(config, new_metrics):
              """Update config with new test metrics, falling back to previous values.

              Args:
                  config: The current config dict to update in-place.
                  new_metrics: New test metrics dict (may be empty if unavailable).

              Returns:
                  The updated config dict.
              """
              if new_metrics and isinstance(new_metrics, dict):
                  # Valid new metrics available — use them
                  config["testMetrics"] = new_metrics
                  print(f"testMetrics updated: {new_metrics.get('totalTests', '?')} tests, status={new_metrics.get('status', '?')}")
              elif "testMetrics" not in config:
                  # No new metrics and no existing values — initialize with safe defaults
                  config["testMetrics"] = {
                      "totalTests": 0,
                      "passed": 0,
                      "failed": 0,
                      "skipped": 0,
                      "duration": 0.0,
                      "coverage": None,
                      "lastRunAt": None,
                      "status": "unknown",
                  }
                  print("testMetrics initialized with safe defaults (no previous values found)")
              else:
                  # No new metrics but existing values present — keep them unchanged
                  print("No new test metrics available, keeping existing testMetrics values")
              return config

          # ── Lê dados coletados ───────────────────────────────────────────
          total_commits    = int(read("/tmp/commits.txt", "1") or "1")
          open_prs         = int(read("/tmp/open_prs.txt", "0") or "0")
          closed_prs       = int(read("/tmp/closed_prs.txt", "0") or "0")
          active_branches  = int(read("/tmp/branches.txt", "1") or "1")
          last_commit_at   = read("/tmp/last_commit.txt", "")
          contributors_cnt = int(read("/tmp/contributors_count.txt", "0") or "0")
          contributors     = read_json("/tmp/contributors.json", [])
          all_prs_raw      = read_json("/tmp/all_prs.json", [])
          board_raw        = read_json("/tmp/board.json", {})

          # ── Lê métricas de teste ─────────────────────────────────────────
          test_metrics_new = read_json("/tmp/test_metrics_data.json", {})

          # ── PRs por autor ────────────────────────────────────────────────
          pr_map = {}
          for pr in all_prs_raw:
              login = pr.get("login", "unknown")
              if login not in pr_map:
                  pr_map[login] = {
                      "login": login,
                      "total": 0, "open": 0, "closed": 0,
                      "avatar_url": pr.get("avatar_url", ""),
                      "html_url": pr.get("html_url", f"https://github.com/{login}")
                  }
              pr_map[login]["total"] += 1
              if pr.get("state") == "open":
                  pr_map[login]["open"] += 1
              else:
                  pr_map[login]["closed"] += 1
          pr_authors = sorted(pr_map.values(), key=lambda x: -x["total"])

          # ── Board metrics + status dos módulos ───────────────────────────
          STATUS_MAP = {
              "Todo": "planned", "In Progress": "in_progress",
              "Blocked": "in_progress", "Revision": "in_progress", "Done": "done",
          }
          MODULE_KEYWORDS = {
              "parser":                  ["tree-sitter", "tree sitter", "análise sintática", "analise sintatica", "parser"],
              "indexer":                 ["faiss", "índice", "indice", "indexa", "indexer"],
              "selector":                ["seletor", "seleção", "selecao", "selector", "ranqueamento", "contexto"],
              "optimizer":               ["orquestrador", "pipeline", "optimizer", "otimizador"],
              "integrations/llm":        ["llm", "openai", "anthropic", "summarizer", "api de llm"],
              "integrations/embeddings": ["embedding", "vetorial", "geração de embeddings", "geracao"],
          }

          project = (board_raw.get("data") or {}).get("organization", {}).get("projectV2") or {}
          cards_by_status = {}
          card_status_by_title = {}

          for item in (project.get("items") or {}).get("nodes", []):
              content = item.get("content") or {}
              title = (content.get("title") or "").lower()
              for fv in (item.get("fieldValues") or {}).get("nodes", []):
                  field = fv.get("field") or {}
                  if (field.get("name") or "").lower() == "status":
                      bs = fv.get("name", "")
                      cards_by_status[bs] = cards_by_status.get(bs, 0) + 1
                      if title:
                          card_status_by_title[title] = STATUS_MAP.get(bs, "planned")

          def find_status(module_id):
              for title, status in card_status_by_title.items():
                  for kw in MODULE_KEYWORDS.get(module_id, []):
                      if kw in title:
                          return status
              return None

          board_metrics = {
              "projectTitle":  project.get("title"),
              "projectNumber": project.get("number"),
              "totalCards":    (project.get("items") or {}).get("totalCount", 0),
              "cardsByStatus": cards_by_status,
              "lastUpdatedAt": datetime.now(timezone.utc).isoformat(),
          }

          # ── Lê config.json com tratamento de corrupção ───────────────────
          config_path = "docs/showcase/config.json"
          config = None
          try:
              with open(config_path, "r", encoding="utf-8") as f:
                  config = json.load(f)
          except (json.JSONDecodeError, ValueError) as e:
              timestamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              backup_path = f"{config_path}.backup.{timestamp}"
              shutil.copy2(config_path, backup_path)
              print(f"[ERROR] config.json corrupted: {e}")
              print(f"[ERROR] Backup created at {backup_path}")
              config = {}
          except FileNotFoundError:
              print(f"[WARNING] {config_path} not found, starting with empty config")
              config = {}

          # ── Atualiza config.json ─────────────────────────────────────────

          # Stats
          config["repoStats"] = {
              "totalCommits":  total_commits,
              "openPRs":       open_prs,
              "closedPRs":     closed_prs,
              "contributors":  contributors_cnt,
              "activeBranches": active_branches,
              "lastCommitAt":  last_commit_at,
              "fetchedAt":     datetime.now(timezone.utc).isoformat(),
          }

          # Contributors com avatares
          config["contributors"] = contributors

          # PRs por autor
          config["prAuthors"] = pr_authors

          # Board metrics + módulos
          config["boardMetrics"] = board_metrics
          for module in config.get("modules", []):
              s = find_status(module["id"])
              if s:
                  module["status"] = s
                  print(f"  {module['id']} → {s}")
              else:
                  print(f"  {module['id']} → {module['status']} (mantido)")

          # Test metrics (com fallback para valores anteriores)
          update_test_metrics(config, test_metrics_new)

          with open(config_path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"\nStats: {json.dumps(config['repoStats'], ensure_ascii=False)}")
          print(f"Contributors: {len(contributors)}")
          print(f"PR authors: {len(pr_authors)}")
          print(f"Board: {json.dumps(board_metrics, ensure_ascii=False)}")
          print(f"TestMetrics: {json.dumps(config.get('testMetrics'), ensure_ascii=False)}")
          PYEOF

      - name: Commit updated config.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/showcase/config.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "chore: sync all metrics from GitHub API"
            git push origin main
            echo "config.json atualizado."
          fi
